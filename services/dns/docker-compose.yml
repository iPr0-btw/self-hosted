services:
  unbound:
    container_name: unbound
    image: klutchell/unbound:latest
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:53:53/tcp"  
      - "127.0.0.1:53:53/tcp"  
      - "100.64.0.3:53:53/udp"  
      - "100.64.0.3:53:53/udp"  
    # - "53:53/tcp"  
    networks:
      pihole_net:
        ipv4_address: 172.20.0.2
    volumes:
      - ./unbound:/etc/unbound/custom.conf.d/
networks:
  pihole_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

