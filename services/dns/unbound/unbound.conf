server:
    verbosity: 2
    interface: 0.0.0.0
    port: 53
    log-queries: yes
    log-replies: no
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    do-ip6: no
    harden-glue: yes
    harden-dnssec-stripped: yes
    prefetch: yes
    num-threads: 1
    edns-buffer-size: 1472
    access-control: 127.0.0.1 allow
    access-control: 100.64.0.0/10 allow
    access-control: 192.168.0.0/16 allow
    access-control: 172.16.0.0/12 allow
    access-control: 10.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse
    log-time-ascii: yes
    use-syslog: yes
    logfile: ""

local-zone: "ppy.sh." static
local-data: "ppy.sh. 3600 IN A 127.0.0.1"
local-data: "*.ppy.sh. 3600 IN A 127.0.0.1"

